<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Deliberately "black", not "black-translucent". With black-translucent iOS
      renders the standalone web view full-screen from y=0 (under the status
      bar) but still sizes the layout viewport to screen.height minus the
      status bar. Measured on an iPhone 16 Pro Max: screen 956, innerHeight
      894, safe-area-inset-top 62 — the view is anchored at the top and 62pt
      short, leaving a dead band along the bottom that reads exactly like a
      leftover Safari toolbar. "black" insets the view below the status bar
      instead, so the viewport is positioned correctly and reaches the bottom
      of the screen. viewport-fit=cover stays, so the home-indicator inset is
      still reported and .nav keeps reserving it.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Aloft" />
    <link rel="icon" href="/pwa-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Aloft</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
